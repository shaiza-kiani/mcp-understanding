[project]
name = "mcp-understanding"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Muhammad Talha", email = "muhammad.talha@deltashoppe.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asgi-lifespan>=2.1",
    "fastapi>=0.115",
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
mcp-understanding = "mcp_understanding:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "fastapi>=0.115",
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "uvicorn[standard]>=0.32",
]
